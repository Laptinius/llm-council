services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: llm-backend
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: llm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
